# Local development stack: PostgreSQL, one-off migrations, optional seed data, and the API.
#   docker compose up -d --build --wait   # start; returns once the API is healthy
#   docker compose run --rm seed          # optional: sample data (idempotent)
#   docker compose down -v                # stop and delete the database volume

x-app: &app
  build: .
  image: stackit-ticketing:dev
  environment:
    ENVIRONMENT: development
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ticketing}:${POSTGRES_PASSWORD:-ticketing}@db:5432/${POSTGRES_DB:-ticketing}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketing}
      POSTGRES_DB: ${POSTGRES_DB:-ticketing}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only the other services reach it. Inspect with `docker compose exec db psql`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Runs once and exits. Kept out of the API's startup so several API replicas never race to migrate.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *app
    command: ["python", "-m", "scripts.seed"]
    restart: "no"
    profiles: [seed]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
